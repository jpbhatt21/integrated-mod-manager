name: Tauri Linux x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            p7zip-full \
            pkg-config \
            wget \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Patch AppImage GTK plugin
        run: bash packaging/appimage/patch-gtk-plugin.sh

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu

      - name: Verify AppImage
        run: |
          appimage=$(find "$PWD/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage" -name '*.AppImage' | head -n1)
          test -n "$appimage"
          cd "$(mktemp -d)"
          "$appimage" --appimage-extract >/dev/null
          if find squashfs-root \( -name 'libwayland-*.so*' -o -name 'im-uim.so' \) | grep .; then
            echo "Bundled libwayland or im-uim found"
            exit 1
          fi
          if grep -rq 'im-uim\.so' --include=immodules.cache squashfs-root; then
            echo "im-uim still listed in immodules.cache"
            exit 1
          fi
          grep -q 'GDK_BACKEND="${GDK_BACKEND:-x11}"' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh

      - name: Create release bundle
        run: |
          rm -rf src-tauri/target/release
          mv src-tauri/target/x86_64-unknown-linux-gnu/release src-tauri/target/release
          python3 utils.py -b
          cp ".bundle/$(jq -r .version latest.json).zip" bundle.zip

      - name: Send bundle to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          : "${TELEGRAM_BOT_TOKEN:?Missing TELEGRAM_BOT_TOKEN secret}"
          : "${TELEGRAM_CHAT_ID:?Missing TELEGRAM_CHAT_ID secret}"
          curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@bundle.zip" \
            -F "caption=Integrated Mod Manager Linux x64 ${GITHUB_REF_NAME}"
